name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Backend build and tests
        working-directory: back
        run: |
          chmod +x gradlew
          ./gradlew clean build jacocoTestReport copyRuntimeClasspath copyTestRuntimeClasspath --no-daemon

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Frontend install
        working-directory: front
        run: npm ci

      - name: Frontend build
        working-directory: front
        run: npm run build

      - name: Frontend tests
        working-directory: front
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  publish-images:
    name: Publish Docker images
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/p7-fsja-orion-back:latest
            ghcr.io/${{ github.repository_owner }}/p7-fsja-orion-back:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/p7-fsja-orion-front:latest
            ghcr.io/${{ github.repository_owner }}/p7-fsja-orion-front:${{ github.sha }}
