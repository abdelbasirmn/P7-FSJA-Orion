services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    image: orion-back:local
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: front/Dockerfile
    image: orion-front:local
    depends_on:
      - backend
    ports:
      - "8081:80"
      - "8443:443"
    restart: unless-stopped
